server {
    listen 80;
    server_name http://78.39.10.22/;

    client_max_body_size 64M;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # نکته کلیدی برای RAG و پردازش‌های هوش مصنوعی:
        # افزایش تایم‌‌اوت برای جلوگیری از 504 Gateway Timeout هنگام تولید متن توسط DeepSeek
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        # غیرفعال‌سازی بافر برای امکان Streaming (در صورت پیاده‌سازی استریم در آینده)
        proxy_buffering off;
    }
}